# M17: single public entry. Round-robin across api replicas; dead
# replicas are ejected (max_fails) and failed requests retried elsewhere
# (proxy_next_upstream) — the failover proof.
upstream shortly_api {
  server api:3000 max_fails=2 fail_timeout=10s;
  server api-2:3000 max_fails=2 fail_timeout=10s;
}

server {
  listen 80;

  # CORS for local frontend dev. In production, the gateway or CDN owns
  # CORS policy — this block exists so Docker Compose works end-to-end
  # without Express needing NODE_ENV=development.
  set $cors_origin "http://localhost:3001";
  if ($http_origin = $cors_origin) {
    set $cors "true";
  }

  location / {
    # Preflight: respond immediately, do not proxy.
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin $cors_origin always;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
      add_header Access-Control-Max-Age 86400 always;
      return 204;
    }

    proxy_pass http://shortly_api;
    proxy_http_version 1.1;

    # Identity + client truth for the app (trust proxy is set server-side).
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Request ids pass through when callers set them; the app mints otherwise.
    proxy_set_header X-Request-Id $http_x_request_id;

    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    # Retry idempotent methods elsewhere on error/timeout (failover).
    proxy_next_upstream error timeout http_502 http_503;

    # CORS headers on proxied responses when origin matches.
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Vary "Origin" always;
  }

  # SSE: long-lived streaming connections need different proxy settings.
  # Must be before location / to claim the path prefix first.
  location ~ ^/api/v1/urls/[^/]+/analytics/stream$ {
    proxy_pass http://shortly_api;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SSE requires no buffering and a very long read timeout.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 86400s;
    proxy_connect_timeout 5s;

    # Chunked transfer for streaming.
    chunked_transfer_encoding off;
  }

  # Container-local liveness for the LB itself.
  location /nginx-health {
    access_log off;
    return 200 'ok';
  }
}
